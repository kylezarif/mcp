[project]
name = "mcp-client"
version = "0.1.0"
description = "OpenAI-backed MCP client that connects to local MCP servers."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.21.0",
    "openai>=1.58.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_client"]
