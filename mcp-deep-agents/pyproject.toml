[project]
name = "mcp-deep-agents"
version = "0.1.0"
description = "Deep-agents style MCP client with planning, scratch files, and MCP tool execution."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.5",
    "langchain-openai>=0.2.1",
    "langchain-core>=0.3.8",
    "python-dotenv>=1.0.1",
    "mcp>=1.21.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_deep_agents"]
